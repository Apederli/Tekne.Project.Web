<div class="flex min-h-screen flex-col bg-white text-slate-900">
  <header class="border-b border-slate-200">
    <nav class="mx-auto flex max-w-6xl items-center gap-6 px-4 py-4">
      <a routerLink="/" class="text-lg font-semibold">Tekne</a>
      <a
        [routerLink]="['/', route.boats]"
        routerLinkActive="text-slate-900 font-medium"
        class="text-sm text-slate-600 hover:text-slate-900"
        >Tekneler</a
      >

      <!-- Giriş/kayıt modal üzerinden açılacak; henüz bağlanmadı. -->
      <div class="ml-auto flex items-center gap-4">
        <button type="button" class="text-sm text-slate-600 hover:text-slate-900">Giriş</button>
        <button
          type="button"
          class="rounded-md bg-slate-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-slate-700"
        >
          Kayıt Ol
        </button>
      </div>
    </nav>
  </header>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-10">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-200 py-6 text-center text-sm text-slate-500">
    Tekne — tekne kiralama platformu
  </footer>
</div>
