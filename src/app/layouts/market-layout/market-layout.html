<!-- Kök: mobilde altta sabit sekme çubuğu var; içerik onun arkasında
     kalmasın diye taban `pb-16`, çubuğun kalktığı `lg:`'de sıfırlanıyor. -->
<div class="flex min-h-screen flex-col bg-white pb-16 text-slate-900 lg:pb-0">
  <header class="border-b border-slate-200">
    <nav class="mx-auto flex max-w-8xl items-center gap-6 px-4 py-4 sm:px-6 lg:px-10">
      <a routerLink="/" class="text-lg font-semibold">Tekne</a>
      <a
        [routerLink]="['/', route.boats]"
        routerLinkActive="text-slate-900 font-medium"
        class="hidden text-sm text-slate-600 hover:text-slate-900 lg:block"
        >Tekneler</a
      >

      <!-- Misafir/girişli dallanması bileşenin içinde; ngSkipHydration'ı da
           o taşıyor. Mobilde bu işler alt çubukta — burada yalnız masaüstü. -->
      <app-market-user-menu class="ml-auto hidden items-center gap-4 lg:flex" />
    </nav>

    <!-- Arama başlığı — şimdilik görsel, tıklama bağlı değil. Açılacak panelin
         planı: bölge seçimi; bölgeye göre kiralama tipine uygun girdiler —
         günlükte tarih + başlangıç/bitiş saati, saatlikte başlangıç + tur
         süresi (arttır/eksilt), ve misafir sayısı (arttır/eksilt). -->
    <div class="mx-auto max-w-8xl px-4 pb-3 sm:px-6 lg:px-10 lg:pb-4">
      <button
        type="button"
        class="mx-auto flex w-full items-center gap-3 rounded-full border border-slate-200 px-4 py-2.5 text-start shadow-sm transition-shadow hover:shadow-md lg:max-w-md"
      >
        <ng-icon name="lucideSearch" size="18" class="shrink-0 text-slate-500" />
        <span class="min-w-0">
          <span class="block truncate text-sm font-medium">Nereye gitmek istiyorsun?</span>
          <span class="block truncate text-xs text-slate-500">Bölge · Tarih · Misafir sayısı</span>
        </span>
      </button>
    </div>
  </header>

  <main class="mx-auto w-full max-w-8xl flex-1 px-4 py-6 sm:px-6 lg:px-10 lg:py-10">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-200 py-6 text-center text-sm text-slate-500">
    Tekne — tekne kiralama platformu
  </footer>

  <!-- Mobil alt navigasyon. `env(safe-area-inset-bottom)`: Capacitor/iOS'ta home
       çubuğunun altında kalmasın (webde 0'a düşer, zararsız). Favoriler ve
       gelen kutusu henüz bağlı değil — backend bekliyor. -->
  <nav
    class="fixed inset-x-0 bottom-0 z-40 border-t border-slate-200 bg-white pb-[env(safe-area-inset-bottom)] lg:hidden"
  >
    <div class="grid grid-cols-5">
      <a
        [routerLink]="['/', route.boats]"
        routerLinkActive="text-primary-deep"
        class="flex flex-col items-center gap-1 py-2 text-slate-500"
      >
        <ng-icon name="lucideCompass" size="22" />
        <span class="text-[11px]">Keşfet</span>
      </a>

      <button type="button" class="flex flex-col items-center gap-1 py-2 text-slate-500">
        <ng-icon name="lucideHeart" size="22" />
        <span class="text-[11px]">Favoriler</span>
      </button>

      <app-market-account-tab />

      <button type="button" class="flex flex-col items-center gap-1 py-2 text-slate-500">
        <ng-icon name="lucideInbox" size="22" />
        <span class="text-[11px]">Gelen Kutusu</span>
      </button>

      <button type="button" class="flex flex-col items-center gap-1 py-2 text-slate-500">
        <ng-icon name="lucideEllipsis" size="22" />
        <span class="text-[11px]">Diğer</span>
      </button>
    </div>
  </nav>
</div>
