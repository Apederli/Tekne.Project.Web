<div hlmSidebarWrapper class="text-foreground">
  <hlm-sidebar collapsible="icon" [ariaLabel]="panelTitle()">
    <!--
      Daraltılmış modda header'da hiçbir şey kalmaz: logo da başlık da
      group-data ile gizlenir. `group` sınıfı hlm-sidebar host'unda,
      data-collapsible da orada — mobil (sheet) dalında host sınıfsız
      olduğu için bu seçiciler eşleşmez ve ikisi de görünür kalır.
    -->
    <div hlmSidebarHeader>
      <!--
        width/height dosyanın doğal boyutu olmalı — görünen boyutu `h-8 w-auto`
        belirler. Attribute'lar tarayıcı en/boy oranını yükleme öncesinde bilsin
        (yer ayırıp sıçrama yapmasın) diye var, ama `w-auto` genişliği de o
        orandan türetiliyor: uydurma bir değer yazılırsa `object-fit: fill`
        varsayılanı görüntüyü yanlış kutuya sıkıştırır ve logo esner.

        h-8: sidebar 16rem, header'ın p-2'si 240px kullanılabilir alan bırakıyor.
        Logo 6.01:1 olduğu için h-10 tam 240px eder ve kenarlara yapışır.
      -->
      <img
        src="/img/logo.png"
        alt="Logo"
        class="h-8 w-auto group-data-[collapsible=icon]:hidden"
        width="1310"
        height="218"
      />
      <p
        class="text-xs font-semibold tracking-wide text-sidebar-foreground/70 uppercase group-data-[collapsible=icon]:hidden"
      >
        {{ panelTitle() }}
      </p>
    </div>

    <div hlmSidebarContent>
      <nav hlmSidebarGroup aria-label="Panel menüsü">
        <ul hlmSidebarMenu>
          @for (item of navItems(); track item.path) {
            <li hlmSidebarMenuItem>
              <!--
                closeMobileSidebarOnClick bilinçli: girdinin varsayılanı
                false, bugünkü davranışta drawer linke basınca kapanıyordu.
                tooltip yalnızca daraltılmış masaüstü modunda görünür,
                bileşen kendi içinde kapatıyor.
              -->
              <a
                hlmSidebarMenuButton
                closeMobileSidebarOnClick
                [tooltip]="item.label"
                [routerLink]="item.path"
                routerLinkActive
                #rla="routerLinkActive"
                [routerLinkActiveOptions]="{ exact: item.exact }"
                [isActive]="rla.isActive"
                ariaCurrentWhenActive="page"
              >
                <ng-icon [name]="item.icon" />
                <span>{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>

    <button hlmSidebarRail aria-label="Kenar çubuğunu aç/kapat"></button>
  </hlm-sidebar>

  <!-- hlmSidebarInset seçicisi main[...] — başka etikete takılamaz. -->
  <main hlmSidebarInset class="min-w-0">
    <header class="flex h-14 items-center gap-2 border-b border-border px-4 lg:px-6">
      <!--
        Mobilde nav alttaki sekme çubuğunda; trigger gizlenir (drawer'a gerek
        kalmaz) ve sol slotu panel başlığı alır. md üstünde tersine döner.
        Trigger'daki `hidden` host sınıfı, hlmBtn'in inline-flex'ine karşı
        classes() birleşiminde kazanır.
      -->
      <p class="text-sm font-semibold md:hidden">{{ panelTitle() }}</p>
      <button
        hlmSidebarTrigger
        size="icon-lg"
        srOnlyText="Menüyü aç/kapat"
        class="hidden md:inline-flex"
      ></button>

      <hlm-popover class="ml-auto" align="end" sideOffset="8">
        <button hlmPopoverTrigger hlmBtn variant="ghost">{{ displayName() }}</button>
        <hlm-popover-content *hlmPopoverPortal class="w-64">
          <div class="px-1.5 py-1">
            <p class="text-sm font-medium">{{ displayName() }}</p>
            @if (authStore.user(); as user) {
              <p class="text-sm text-muted-foreground">{{ user.email }}</p>
            }
          </div>
          <div class="border-t border-border"></div>
          <button hlmBtn variant="ghost" class="justify-start" (click)="signOut()">
            Çıkış yap
          </button>
        </hlm-popover-content>
      </hlm-popover>
    </header>

    <div class="flex-1 p-4 sm:p-6 lg:p-8">
      <ng-content />
    </div>

    <!--
      Mobil navigasyon: alt sekme çubuğu. `sticky` bilinçli (fixed değil) —
      akış içinde yer kapladığı için içeriğe padding telafisi gerekmez.
      safe-area padding'i Capacitor/iOS home-bar'ı için; tarayıcıda 0.
      Aktif renk aria-[current=page] üzerinden: routerLinkActive'in sınıf
      eklemesi taban text-muted-foreground ile aynı özgüllükte çakışırdı,
      attribute'lu bileşik seçici deterministik kazanır.
    -->
    <nav
      class="sticky bottom-0 z-10 flex border-t border-border bg-background pb-[env(safe-area-inset-bottom)] md:hidden"
      aria-label="Alt menü"
    >
      @for (item of navItems(); track item.path) {
        <a
          class="flex h-16 flex-1 flex-col items-center justify-center gap-1 px-1 text-muted-foreground aria-[current=page]:text-primary-deep"
          [routerLink]="item.path"
          routerLinkActive
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: item.exact }"
        >
          <ng-icon [name]="item.icon" size="22" />
          <span class="w-full truncate text-center text-[11px] leading-none">
            {{ item.shortLabel ?? item.label }}
          </span>
        </a>
      }
    </nav>
  </main>
</div>
