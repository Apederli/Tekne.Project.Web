<div class="relative overflow-hidden rounded-xl border border-border bg-background">
  <a [routerLink]="detailUrl()" class="block" [attr.aria-label]="cardLabel()">
    <span class="block" (click)="swallowSwiperClick($event)">
      <app-photo-gallery [photos]="boat().photos" [alt]="boat().name" class="aspect-[5/4] w-full" />
    </span>

    <div class="p-3">
      <div class="flex items-center justify-between gap-2">
        <span class="truncate font-medium">{{ boat().name }}</span>
        <span class="shrink-0 text-sm text-muted-foreground">{{ boat().totalCapacity }} kişi</span>
      </div>
      @if (location()) {
        <span class="mt-1 block text-sm text-muted-foreground">{{ location() }}</span>
      }
    </div>
  </a>

  <!-- Overlay linkin KARDEŞİ: link içinde buton geçersiz HTML olurdu ve ekran
       okuyucu linkin adına düğme metnini katardı. Kapsayıcı pointer-events-none,
       düğme pointer-events-auto — rozet ile kalp arasındaki boş şerit tıklamayı
       linke geçirir. -->
  <div
    class="pointer-events-none absolute inset-x-1.5 top-1.5 z-20 flex items-start justify-between"
  >
    <!-- TODO(backend): Boat modelinde anında rezervasyon alanı yok; rozet test için sabit. -->
    <span
      class="rounded-full bg-white/90 px-3 py-1.5 text-xs font-semibold text-primary-deep shadow-sm shadow-slate-500 backdrop-blur-sm"
    >
      ⚡ Anında Rezerve
    </span>

    <button
      type="button"
      class="pointer-events-auto rounded-full p-1 transition-transform duration-100 ease-in active:scale-90"
      (click)="toggleFavorite()"
    >
      <!-- Lucide çizgi seti: dolu/boş ayrımı fill ile. Yarı saydam dolgu + beyaz
           çizgi, fotoğraf üzerinde her zeminde okunur (teknevia kalıbı). -->
      <ng-icon
        name="lucideHeart"
        size="26"
        class="drop-shadow-md"
        [class]="
          favorite() ? 'text-red-500 [&_svg]:fill-current' : 'text-white [&_svg]:fill-black/30'
        "
      />
      <span class="sr-only">
        {{ favorite() ? 'Favorilerden çıkar' : 'Favorilere ekle' }}
      </span>
    </button>
  </div>
</div>
