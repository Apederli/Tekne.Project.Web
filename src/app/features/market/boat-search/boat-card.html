<div class="relative">
  <a [routerLink]="detailUrl()" class="block" [attr.aria-label]="cardLabel()">
    <span class="block overflow-hidden rounded-xl" (click)="swallowSwiperClick($event)">
      <app-photo-gallery [photos]="boat().photos" [alt]="cardLabel()" class="aspect-[5/4] w-full" />
    </span>

    <div class="pt-3">
      <div class="flex items-start justify-between gap-2">
        <span class="min-w-0 truncate font-medium">
          {{ location() || typeLabel() }}
          @if (location() && departure()) {
            <span class="text-sm font-normal text-muted-foreground">
              - ({{ departure() }} Kalkışlı)
            </span>
          }
        </span>

        <!-- TODO(backend): yorum/puan uçları yok; değerler test için sabit. -->
        <span class="flex shrink-0 items-center gap-1 text-sm">
          <ng-icon name="lucideStar" size="14" class="[&_svg]:fill-current" aria-hidden="true" />
          4.8
          <span class="text-muted-foreground">(12)</span>
        </span>
      </div>

      @if (location()) {
        <span class="mt-1 block text-sm text-muted-foreground">{{ typeLabel() }}</span>
      }
      <span class="mt-0.5 block text-sm text-muted-foreground">
        Kapasite: {{ boat().totalCapacity }} kişi
      </span>
    </div>
  </a>

  <div
    class="pointer-events-none absolute inset-x-1.5 top-1.5 z-20 flex items-start justify-between"
  >
    <!-- TODO(backend): Boat modelinde anında rezervasyon alanı yok; rozet test için sabit. -->
    <span
      class="rounded-full bg-white/90 px-3 py-1.5 text-xs font-semibold text-primary-deep shadow-sm shadow-slate-500 backdrop-blur-sm"
    >
      ⚡ Anında Rezerve
    </span>

    <button
      type="button"
      class="pointer-events-auto rounded-full p-1 transition-transform duration-100 ease-in active:scale-90"
      (click)="toggleFavorite()"
    >
      <ng-icon
        name="lucideHeart"
        size="26"
        class="drop-shadow-md"
        [class]="
          favorite() ? 'text-red-500 [&_svg]:fill-current' : 'text-white [&_svg]:fill-black/30'
        "
      />
      <span class="sr-only">
        {{ favorite() ? 'Favorilerden çıkar' : 'Favorilere ekle' }}
      </span>
    </button>
  </div>
</div>
