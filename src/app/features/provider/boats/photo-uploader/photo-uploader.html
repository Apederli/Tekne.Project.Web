<div>
  <!-- Mobile-first: telefonda iki sütun, ekranla birlikte genişliyor. -->
  <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4">
    @if (!full()) {
      <!--
        Gizli input bir label ile sarılı: telefonda tek dokunuşla galeri açılır.
        Silme sürerken input disabled: input disabled olunca tarayıcı label'a
        tıklamayı da dosya seçiciyi açmaya çevirmiyor, `has-disabled` ile de
        görünüşü ölü bir kontrol gibi kalmıyor.
      -->
      <label
        class="flex aspect-square cursor-pointer flex-col items-center justify-center gap-2 rounded-lg border border-dashed text-muted-foreground hover:bg-muted/50 focus-within:ring-2 focus-within:ring-ring has-disabled:cursor-not-allowed has-disabled:opacity-50 has-disabled:hover:bg-transparent"
        [class]="dragging() ? 'border-primary bg-muted/50' : 'border-input'"
        (dragover)="$event.preventDefault(); dragging.set(true)"
        (dragleave)="dragging.set(false)"
        (drop)="onDrop($event)"
      >
        <ng-icon name="lucideImagePlus" size="24" />
        <span class="text-sm">Fotoğraf ekle</span>
        <input
          type="file"
          accept="image/*"
          multiple
          class="sr-only"
          [disabled]="deletingId() !== null"
          #fileInput
          (change)="onFileInput(fileInput)"
        />
      </label>
    }

    @for (photo of visible(); track photo.id; let i = $index) {
      <div
        class="relative aspect-square overflow-hidden rounded-lg bg-muted"
        [class]="deletingId() === photo.id ? 'opacity-50' : ''"
      >
        <img
          [src]="photoUrl.url(photo.objectKey)"
          [alt]="photoAlt(i)"
          loading="lazy"
          decoding="async"
          class="h-full w-full object-cover"
        />

        @if (i === 0) {
          <span
            data-testid="cover-badge"
            class="absolute start-2 top-2 rounded-full bg-black/60 px-2 py-0.5 text-xs text-white"
          >
            Kapak
          </span>
        }

        <!-- Dokunmatikte hover yok: düğme daima görünür. -->
        <button
          hlmBtn
          variant="secondary"
          size="icon-sm"
          type="button"
          class="absolute end-2 top-2 rounded-full"
          [disabled]="deletingId() !== null || uploadingCount() > 0"
          (click)="remove(photo)"
        >
          <ng-icon name="lucideTrash2" size="16" />
          <span class="sr-only">{{ i + 1 }}. fotoğrafı sil</span>
        </button>
      </div>
    }

    @for (skeleton of skeletons(); track skeleton) {
      <div class="aspect-square animate-pulse rounded-lg bg-muted"></div>
    }
  </div>

  @if (skippedMessage()) {
    <p class="mt-3 text-sm text-muted-foreground" role="status">{{ skippedMessage() }}</p>
  }
</div>
