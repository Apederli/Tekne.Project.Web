<div class="relative" [class]="galleryClass()">
  @if (visible().length === 0) {
    <div
      class="flex h-full items-center justify-center rounded-lg border border-dashed border-input"
    >
      <p class="text-sm text-muted-foreground">Fotoğraf yok</p>
    </div>
  } @else {
    <!-- Parametreler attribute olarak: upgrade öncesi property ataması class
         accessor'ı gölgeleyebiliyor, attribute'lar `register()` sonrası okunuyor.
         `rewind` (loop değil): Swiper loop modu slotlanmış slaytların DOM sırasını
         değiştiriyor, o düğümler `@for`'a ait. Dinamik noktalar (teknevia kartıyla
         aynı): en fazla 5 ana nokta, gerisi kenarda küçülür — 20 fotoğraflı tekne
         de taşmaz. Renk/ölçü shadow DOM'a `--swiper-pagination-*` ile geçiyor. -->
    <swiper-container
      class="block h-full w-full overflow-hidden rounded-lg [--swiper-pagination-bullet-inactive-color:#fff] [--swiper-pagination-bullet-inactive-opacity:0.6] [--swiper-pagination-bullet-size:6px] [--swiper-pagination-color:#fff]"
      [attr.rewind]="scrollable()"
      [attr.pagination]="scrollable()"
      pagination-clickable="true"
      pagination-dynamic-bullets="true"
    >
      @for (photo of visible(); track photo.id; let i = $index) {
        <!-- `block h-full`: upgrade/SSR öncesi de ilk fotoğraf düzgün boyansın. -->
        <swiper-slide class="block h-full w-full">
          <img
            [src]="photoUrl.url(photo.objectKey)"
            [alt]="photoAlt(i)"
            [attr.loading]="i === 0 ? 'eager' : 'lazy'"
            decoding="async"
            draggable="false"
            class="h-full w-full cursor-grab select-none object-cover active:cursor-grabbing"
          />
        </swiper-slide>
      }
    </swiper-container>

  }

  <!-- Çağrı yerinin etiketi: "Hemen Rezervasyon", "Yayında değil" vb.
       Konumlandırmayı çağıran yapar; oklar z-10'da, overlay z-20 ile üstte durur. -->
  <ng-content />
</div>
